<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Клуб будущего</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Панель мероприятий клуба будущего</h1>
    <p>Выберите интересное занятие и запишитесь в клубе.</p>

    <table>
        <thead>
            <tr>
                <th>№</th>
                <th>Мероприятие</th>
                <th>Направление</th> <!-- Это новый столбец -->
                <th>Места</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody>
            {% for event in events %}
            <tr>
                <td>{{ event.id }}</td>
                <td>{{ event.title }}</td>
                <td>{{ event.direction }}</td> <!-- Вывод направления -->
                <td>{{ event.seats }}</td>
                <td>{{ event.status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
